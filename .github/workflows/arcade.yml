name: arcade
# Runs once a day, on every push to main, and on demand (Actions tab):
# - draws the snake, Pac-Man and Breakout games from the contribution grid
#   into assets/
# - rebuilds the stats cards into profile-summary-card-output/
# Everything is saved inside this repo, so the images also show while the
# repo is private.
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: arcade
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout'
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake-dark.svg?palette=github-dark
      - name: draw the most used languages card
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANG_TOKEN: ${{ secrets.LANG_TOKEN }}
        run: node .github/scripts/languages.mjs dist/languages.svg
      - name: save the games in assets/
        run: |
          mkdir -p assets
          cp dist/*.svg assets/
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: redraw arcade graphs" || echo "nothing changed"
          git push

  stats:
    needs: games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: America/Toronto
          THEME: tokyonight
          ANIMATION: fade
