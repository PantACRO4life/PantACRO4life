name: profile images
# Runs once a day, on every push to main, and on demand (Actions tab).
# One job, one save: draws the Pac-Man, Breakout and snake games, then
# .github/scripts/cards.mjs draws the RIS themed header, cards and dividers
# and recolors the games red. Everything lands in assets/.
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: profile-images
  cancel-in-progress: false
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout'
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/github-snake-dark.svg?color_snake=#e01b31&color_dots=#1f242b,#4a0d14,#7a1220,#b3172a,#ff2a3d&color_background=transparent
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: draw the RIS cards
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANG_TOKEN: ${{ secrets.LANG_TOKEN }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          node .github/scripts/lines.mjs dist
          node .github/scripts/cards.mjs dist
      - name: save in assets/
        run: |
          rm -rf assets profile-summary-card-output
          mkdir -p assets
          cp dist/*.svg assets/
          rm -rf dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: redraw profile images" || echo "nothing changed"
          git push
